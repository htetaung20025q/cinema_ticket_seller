version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cinema_postgres
    restart: always
    environment:
      POSTGRES_USER: cinema_user
      POSTGRES_PASSWORD: cinema_secret_password
      POSTGRES_DB: cinemadb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema_user -d cinemadb"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: cinema_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cinevibe.com
      PGADMIN_DEFAULT_PASSWORD: admin_secret_password
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
